[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "equity-tracker"
version = "0.1.0"
description = "Auditable equity research dashboards — every claim in the output is asserted as a test"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "jovi-maverick" }]
keywords = ["finance", "equities", "backtesting", "technical-analysis", "dashboard", "yfinance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
live = ["yfinance>=0.2.40", "pandas>=2.0"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
tracker = "tracker.cli:main"

[project.urls]
Homepage = "https://github.com/jovi-maverick/equity-tracker"
Documentation = "https://jovi-maverick.github.io/equity-tracker/"
Issues = "https://github.com/jovi-maverick/equity-tracker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
