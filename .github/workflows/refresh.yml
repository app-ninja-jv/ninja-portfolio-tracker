name: Refresh dashboard

# Manual only until two clean runs. Uncomment the schedule after that.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers"
        required: false
        default: "NVDA,AMD,INTC,ASML,TXN,AMAT,MU,QCOM,ARM,AVGO"
  # schedule:
  #   - cron: "0 22 * * 1-5"   # weekdays 22:00 UTC, after the US close

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[live,dev]"

      - name: Fetch
        run: |
          tracker fetch --tickers "${{ inputs.tickers || 'NVDA,AMD,INTC,ASML,TXN,AMAT,MU,QCOM,ARM,AVGO' }}" --weeks 104

      - name: Doctor — golden-value cross-check
        run: tracker doctor --golden tests/fixtures/golden_2026_07_31.json
        continue-on-error: true   # reference prices age; warn, don't block

      - name: Render
        run: tracker report --out build/index.html --title "Equity Tracker"

      - name: Verify — blocks publish on failure
        run: tracker verify --report build/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
